version: '3.8'

services:
  hrms-db:
    image: mysql:8.0
    container_name: hrms-db
    restart: always
    environment:
      MYSQL_DATABASE: hrms_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - hrms-network

  hrms-backend:
    build:
      context: ./hrms-backend
      dockerfile: Dockerfile
    container_name: hrms-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - hrms-db
    networks:
      - hrms-network

  hrms-frontend:
    build:
      context: ./hrms-frontend
      dockerfile: Dockerfile
    container_name: hrms-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - hrms-backend
    networks:
      - hrms-network

volumes:
  db_data:

networks:
  hrms-network:
    driver: bridge